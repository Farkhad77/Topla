# Arenio — web konteynerinin nginx konfiqi.
# Statik frontend + API və şəkil proxy-si. Hər şey eyni origin-dədir,
# ona görə CORS problemi yaranmır.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Şəkil yükləmə üçün vacibdir — nginx default-u 1MB-dır və upload-u kəsər
    client_max_body_size 30m;

    # API → backend konteyneri
    location /api/ {
        proxy_pass http://api:5077;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Yüklənmiş stadion şəkilləri → backend static files (/Storage/...)
    location /Storage/ {
        proxy_pass http://api:5077;
        proxy_set_header Host $host;
        # Şəkillər dəyişməzdir (GUID adlı) — brauzer cache-inə icazə ver
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=604800";
    }

    # Vite build-in barmaq izli assets-ləri — uzunmüddətli cache
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA — qalan bütün yollar index.html-ə düşür (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
