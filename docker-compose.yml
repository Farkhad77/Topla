# ============================================================
# Arenio — production compose (kiçik VPS üçün kökələnib, ≤2GB RAM)
# İstifadə: deploy/DEPLOY.md faylındakı addımlara bax.
# Sirlər deploy/.env faylından gəlir (deploy/env.example-dan yarat).
# ============================================================

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ArenioDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ArenioDb"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  rabbitmq:
    image: rabbitmq:3.13-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - ./data/rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5077
      # Konteyner qalxanda EF migration-ları avtomatik tətbiq olunur
      ApplyMigrationsOnStartup: "true"
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=ArenioDb;Username=postgres;Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__Redis: "redis:6379"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: "5672"
      RabbitMQ__UserName: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}
      JwtSettings__SecretKey: ${JWT_SECRET}
      JwtSettings__Issuer: ${PUBLIC_URL}
      JwtSettings__Audience: ${PUBLIC_URL}
      JwtSettings__ExpiryMinutes: "60"
      FrontendSettings__ResetPasswordUrl: "${PUBLIC_URL}/reset-password"
      EmailSettings__From: ${SMTP_FROM}
      EmailSettings__SmtpHost: ${SMTP_HOST}
      EmailSettings__SmtpPort: ${SMTP_PORT}
      EmailSettings__SmtpUser: ${SMTP_USER}
      EmailSettings__SmtpPass: ${SMTP_PASS}
      StorageSettings__RootPath: Storage
      StorageSettings__StadiumFolder: Stadiums
    volumes:
      # Şəkillər konteyner yenilənəndə itməsin
      - ./data/storage:/app/Storage

  web:
    build:
      context: ./topla-web
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
